name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Problem data is up to date (reference solutions re-checked against brute force)
        run: |
          python3 data/build.py
          git diff --exit-code -- src/data
      - run: npm run typecheck
      - name: Unit tests (includes real Pyodide, g++ and javac)
        run: |
          npm test 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=Unit tests failed::$(grep -vE '^\s*$' test.log | tail -n 40 | cut -c1-200 | head -c 3000 | sed ':a;N;$!ba;s/\n/ | /g')"
          fi
          exit "$code"
      - name: Build (accounts are switched on when the repository variables below are set)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_AUTH_PROVIDERS: ${{ vars.AUTH_PROVIDERS }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - name: Browser tests
        run: npm run e2e

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
